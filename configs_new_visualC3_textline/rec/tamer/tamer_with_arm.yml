Global:
  device: gpu
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./outputs/output_new_visualC3_textline/tamer_with_arm/
  save_epoch_step: [1, 25]
  # evaluation is run every 2000 iterations
  eval_batch_step: [0, 2000]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: True
  pretrained_model: 
  checkpoints:
  use_tensorboard: false
  infer_img:
  distributed: true  # 启用分布式训练
  # for data or label process
  character_dict_path: &character_dict_path ./tools/utils/dict/visual_c3_ids/char_dict.txt # ch
  ids_dict_path: &ids_dict_path ./tools/utils/dict/visual_c3_ids/minimal_ids_dict.txt
  char_to_ids_path: &char_to_ids_path ./tools/utils/dict/visual_c3_ids/char_to_ids.txt
  max_text_length: &max_text_length 15   # 文本序列最大长度
  max_ids_length: &max_ids_length 100     # IDS 序列最大长度（通常更长）
  use_space_char: &use_space_char True
  save_res_path: ./outputs/output_new_visualC3_textline/tamer_with_arm/predicts_tamer.txt
  use_amp: True

Optimizer:
  name: AdamW
  lr: 6.5e-4 # for 4gpus bs256/gpu
  weight_decay: 0.05
  filter_bias_and_bn: False

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 5
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: TAMER  # 使用 TAMER 算法，匹配 TAMER_Encoder 和 TextIDSTreeDecoder
  Transform:
  Encoder:
    name: TAMER_Encoder
    d_model: 512
    growth_rate: 32
    num_layers: 4
  Decoder:
    name: TextIDSTreeDecoder
    nhead: 8
    num_decoder_layers: 3
    dim_feedforward: 1024
    dropout: 0.3
    dc: 64
    cross_coverage: True   # 启用交叉注意力覆盖惩罚
    self_coverage: True   # 如需自注意力覆盖可改为 True
    max_text_length: *max_text_length
    max_ids_length: *max_ids_length
    text_vocab_path: *character_dict_path
    ids_vocab_path: *ids_dict_path
    use_space_char: *use_space_char

Loss:
  name: TextIDSTreeLoss
  ignore_index: 0
  lambda_struct: 1.0
  lambda_text: 1.0
  lambda_ids: 1.0

PostProcess:
  name: TextIDSLabelDecode
  text_character_dict_path: *character_dict_path
  ids_character_dict_path: *ids_dict_path
  char_to_ids_path: *char_to_ids_path
  use_space_char: *use_space_char

Metric:
  name: RecTextIDSMetric
  main_indicator: acc
  max_len: *max_text_length     # 文本分支最大长度
  max_len_ids: *max_ids_length  # IDS分支最大长度
  # is_filter: True

Train:
  dataset:
    name: LMDBDataSet
    data_dir: /ipfs/lirunrui/lmdb_dataset/visual_c3_new_textline/train_lmdb
    transforms:
      - DecodeImagePIL: # load image
          img_mode: RGB
      - PARSeqAugPIL:
      - TextIDSTreeMultiLabelEncode:
          character_dict_path: *character_dict_path
          ids_dict_path: *ids_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length   # 文本序列截断
          max_ids_length: *max_ids_length     # IDS 序列截断（供 label_ids_seq 使用）
          char_to_ids_path: *char_to_ids_path
      - RecTVResize:
          image_shape: [32, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length', 'ids_label', 'ids_length', 'tree_parents_label'] 
  loader:
    shuffle: True
    batch_size_per_card: &batch_size_per_card 256
    drop_last: True
    num_workers: 0  # 临时设为0以排除DataLoader多进程问题

Eval:
  dataset:
    name: LMDBDataSet
    data_dir: /ipfs/lirunrui/lmdb_dataset/visual_c3_new_textline/test_lmdb/test_correct
    transforms:
      - DecodeImagePIL: # load image
          img_mode: RGB
      # - SaveRawImageBytes:  # eval 时打开可保存原始图像
      #     dst_key: image_raw
      #     src_key: image
      - TextIDSTreeMultiLabelEncode:
          character_dict_path: *character_dict_path
          ids_dict_path: *ids_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length   # 文本序列截断
          max_ids_length: *max_ids_length     # IDS 序列截断（供 label_ids_seq 使用）
          char_to_ids_path: *char_to_ids_path
      - RecTVResize:
          image_shape: [32, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length', 'ids_label', 'ids_length', 'tree_parents_label'] 
          # keep_keys: ['image', 'label', 'length', 'image_raw'] # eval 时打开可保存原始图像
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: *batch_size_per_card
    num_workers: 0  # 临时设为0以排除DataLoader多进程问题
    # collate_fn: RecWithRawCollator # eval 时打开可保存原始图像