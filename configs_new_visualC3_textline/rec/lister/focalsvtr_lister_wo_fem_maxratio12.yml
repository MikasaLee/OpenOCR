Global:
  device: gpu
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./outputs/output_new_visualC3_textline/focalsvtr_lister_wo_fem_maxratio12/
  save_epoch_step: [1, 48]
  # evaluation is run every 2000 iterations
  eval_batch_step: [0, 2000000]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: False
  pretrained_model:
  checkpoints:
  use_tensorboard: false
  infer_img:
  # for data or label process
  character_dict_path: &character_dict_path ./tools/utils/dict/visual_c3_ids/char_dict.txt # ch
  max_text_length: &max_text_length 15
  use_space_char: &use_space_char True
  save_res_path: ./outputs/output_new_visualC3_textline/focalsvtr_lister_wo_fem_maxratio12/predicts_focalsvtr_lister_wo_fem_maxratio12.txt
  use_amp: True
  grad_clip_val: 20

Optimizer:
  name: AdamW
  lr: 6.5e-4
  weight_decay: 0.05
  filter_bias_and_bn: True

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 5
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: LISTER
  Transform:
  Encoder:
    name: FocalSVTR
    img_size: [32, 256]
    depths: [6, 6, 9]
    embed_dim: 96
    sub_k: [[1, 1], [2, 1], [1, 1]]
    focal_levels: [3, 3, 3]
    last_stage: False
    feat2d: True
  Decoder:
    name: LISTERDecoder
    detach_grad: False
    attn_scaling: True
    use_fem: False

Loss:
  name: LISTERLoss

PostProcess:
  name: LISTERLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  # is_filter: True

Train:
  dataset:
    name: LMDBDataSet
    data_dir: /ipfs/lirunrui/lmdb_dataset/visual_c3_new_textline/train_lmdb
    transforms:
      - DecodeImagePIL: # load image
          img_mode: RGB
      - PARSeqAugPIL:
      - EPLabelEncode: # Class handling label
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - RecTVResize:
          image_shape: [32, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: True
    batch_size_per_card: &batch_size_per_card 512
    drop_last: True
    num_workers: 12

Eval:
  dataset:
    name: LMDBDataSet
    data_dir: /ipfs/lirunrui/lmdb_dataset/visual_c3_new_textline/test_lmdb/test_correct
    transforms:
      - DecodeImagePIL: # load image
          img_mode: RGB
      - EPLabelEncode: # Class handling label
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - RecTVResize:
          image_shape: [32, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: *batch_size_per_card
    num_workers: 12
