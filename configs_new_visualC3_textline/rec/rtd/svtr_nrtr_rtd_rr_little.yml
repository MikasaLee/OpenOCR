Global:
  device: gpu
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./outputs/output_new_visualC3_textline/svtr_nrtr_rtd_rr_little/
  save_epoch_step: [1, 25]
  eval_batch_step: [0, 2000]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: False
  pretrained_model:
  checkpoints:
  use_tensorboard: false
  infer_img:
  distributed: true
  character_dict_path: &character_dict_path ./tools/utils/dict/visual_c3_ids/char_dict.txt
  max_text_length: &max_text_length 15
  use_space_char: &use_space_char True
  save_res_path: ./outputs/output_new_visualC3_textline/svtr_nrtr_rtd_rr_little/predicts_rtd.txt
  use_amp: True

Optimizer:
  name: AdamW
  lr: 6.5e-4
  weight_decay: 0.05
  filter_bias_and_bn: False

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 5
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: RTD
  Transform:
  Encoder:
    name: SVTRv2LNConvTwo33
    max_sz: [32, 256]
    use_pos_embed: True
    out_channels: 256
    dims: [128, 256, 384]
    depths: [6, 6, 6]
    num_heads: [4, 8, 12]
    mixer: [['Conv','Conv','Conv','Conv','Conv','Conv'],['Conv','Conv','FGlobal','Global','Global','Global'],['Global','Global','Global','Global','Global','Global']]
    local_k: [[5, 5], [5, 5], [-1, -1]]
    sub_k: [[1, 1], [2, 1], [-1, -1]]
    last_stage: True
    feat2d: False
  Decoder:
    name: NRTRRTDDecoder
    num_encoder_layers: -1
    num_decoder_layers: 6
    nhead: 8
    beam_size: 0
    max_len: *max_text_length
    attention_dropout_rate: 0.0
    residual_dropout_rate: 0.1

Loss:
  name: RTDLoss
  label_smoothing: 0.1
  rtd_weight: 1.0

PostProcess:
  name: RTDLabelDecode
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecRTDMetric
  main_indicator: acc
  max_len: *max_text_length

Train:
  dataset:
    name: LMDBDataSet
    data_dir: /ipfs/lirunrui/lmdb_dataset/visual_c3_new_textline/train_lmdb
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - PARSeqAugPIL:
      - RTDLabelEncode:
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
          replace_ratio: 0.05
          hard_ratio: 0.9
          char_to_ids_path: ./tools/utils/dict/visual_c3_ids/char_to_ids.txt
      - RecTVResize:
          image_shape: [32, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length', 'rtd_label']
  loader:
    shuffle: True
    batch_size_per_card: 256
    drop_last: True
    num_workers: 8

Eval:
  dataset:
    name: LMDBDataSet
    data_dir: /ipfs/lirunrui/lmdb_dataset/visual_c3_new_textline/test_lmdb/test_correct
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - RTDLabelEncode:
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
          replace_ratio: 0.0
      - RecTVResize:
          image_shape: [32, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length', 'rtd_label']
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: 256
    num_workers: 8
