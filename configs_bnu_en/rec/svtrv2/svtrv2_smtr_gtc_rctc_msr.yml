Global:
  device: gpu
  epoch_num: 40
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./outputs/output_bnu_en/svtrv2_smtr_gtc_rctc_msr/
  save_epoch_step: [10, 10]
  eval_epoch_step: [0, 1]
  eval_batch_step: [0, 2000]
  cal_metric_during_train: True
  pretrained_model:
  checkpoints:
  use_tensorboard: false
  infer_img:
  character_dict_path: &character_dict_path ./tools/utils/EN_symbol_dict.txt
  max_text_length: &max_text_length 100
  use_space_char: &use_space_char True
  save_res_path: ./outputs/output_bnu_en/svtrv2_smtr_gtc_rctc_msr/predicts_svtrv2_smtr_gtc_rctc_msr.txt
  use_amp: True

Optimizer:
  name: AdamW
  lr: 6.5e-4
  weight_decay: 0.05
  filter_bias_and_bn: True

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 2
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: SVTRv2
  in_channels: 3
  Transform:
  Encoder:
    name: SVTRv2LNConvTwo33
    use_pos_embed: False
    dims: [128, 256, 384]
    depths: [6, 6, 6]
    num_heads: [4, 8, 12]
    mixer: [['Conv','Conv','Conv','Conv','Conv','Conv'],['Conv','Conv','FGlobal','Global','Global','Global'],['Global','Global','Global','Global','Global','Global']]
    local_k: [[5, 5], [5, 5], [-1, -1]]
    sub_k: [[1, 1], [2, 1], [-1, -1]]
    last_stage: false
    feat2d: True
  Decoder:
    name: GTCDecoder
    infer_gtc: True
    detach: False
    gtc_decoder:
      name: SMTRDecoder
      num_layer: 1
      ds: True
      max_len: *max_text_length
      next_mode: &next True
      sub_str_len: &subsl 5
    ctc_decoder:
      name: RCTCDecoder

Loss:
  name: GTCLoss
  ctc_weight: 0.1
  gtc_loss:
    name: SMTRLoss

PostProcess:
  name: GTCLabelDecode
  gtc_label_decode:
    name: SMTRLabelDecode
    next_mode: *next
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecGTCMetric
  main_indicator: acc
  is_filter: True

Train:
  dataset:
    name: RatioDataSetTVResizeRecursive
    ds_width: True
    padding: false
    base_shape: &base_shape [[64, 64], [96, 48], [112, 40], [128, 32]]
    base_h: &base_h 32
    data_dir_list: ['/a800data1/lirunrui/origin_datasets/bnu_en_htr_train/']
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - PARSeqAugPIL:
      - GTCLabelEncode:
          gtc_label_encode:
            name: SMTRLabelEncode
            sub_str_len: *subsl
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'label_subs', 'label_next', 'length_subs',
            'label_subs_pre', 'label_next_pre', 'length_subs_pre', 'length', 'ctc_label', 'ctc_length']
  sampler:
    name: RatioSampler
    scales: [[128, 32]]
    first_bs: &bs 256
    fix_bs: false
    divided_factor: [4, 16]
    is_training: True
  loader:
    shuffle: True
    batch_size_per_card: *bs
    drop_last: True
    max_ratio: &max_ratio 16
    num_workers: 16

Eval:
  dataset:
    name: RatioDataSetTVResizeRecursive
    ds_width: True
    padding: false
    base_shape: *base_shape
    base_h: *base_h
    data_dir_list: ['/a800data1/lirunrui/origin_datasets/bnu_en_benchmark_lmdb/common_0']
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - GTCLabelEncode:
          gtc_label_encode:
            name: ARLabelEncode
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'length', 'ctc_label', 'ctc_length']
  sampler:
    name: RatioSampler
    scales: [[128, 32]]
    first_bs: *bs
    fix_bs: false
    divided_factor: [4, 16]
    is_training: False
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: *bs
    max_ratio: *max_ratio
    num_workers: 16
