Global:
  device: gpu
  epoch_num: 40
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./outputs/output_bnu_en/eduocr_small/
  save_epoch_step: [25, 1]
  eval_epoch_step: [0, 1]
  eval_batch_step: [0, 2000]
  cal_metric_during_train: False
  pretrained_model:
  checkpoints: 
  use_tensorboard: false
  infer_img:
  character_dict_path: &character_dict_path ./tools/utils/EN_symbol_dict.txt
  max_text_length: &max_text_length 100
  use_space_char: &use_space_char True
  save_res_path: ./outputs/output_bnu_en/eduocr_small/predicts_eduocr.txt
  use_amp: True

Optimizer:
  name: AdamW
  lr: 6.5e-4
  weight_decay: 0.05
  filter_bias_and_bn: True

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 2
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: EduOCR
  in_channels: 3
  Transform:
  Encoder:
    name: SALGEncoder
    use_pos_embed: False
    max_sz: [32, 512]
    dims: [96, 192, 256]
    depths: [3, 6, 6]
    num_heads: [3, 6, 8]
    mixer: [['Conv', 'Conv', 'Conv'],
            ['Conv', 'Conv', 'Conv', 'Conv','Conv','FGlobal'],
            ['Global', 'Global', 'Global','Global','Global','Global']]
    local_k: [[5, 5], [5, 5], [-1, -1]]
    sub_k: [[2, 1], [2, 1], [-1, -1]]
    downsample: [True, True, False]
    last_stage: false
    use_GBC: True
    feat2d: True
  Decoder:
    name: GTCDecoder
    infer_gtc: True
    detach: False
    gtc_decoder:
      name: SSMDecoder
      num_layers: 3
      nhead: 8
      max_len: *max_text_length
    ctc_decoder:
      name: PPHDecoder
      num_heads: 8

Loss:
  name: GTCLoss
  ctc_weight: 0.05
  gtc_weight: 1.0
  gtc_loss:
    name: ARLoss
    label_smoothing: 0.0

PostProcess:
  name: GTCLabelDecode
  only_gtc: False
  gtc_label_decode:
    name: ARLabelDecode
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecGTCMetric
  main_indicator: gtc_acc
  is_filter: False

Train:
  dataset:
    name: LMDBDataSet
    data_dir: /a800data1/lirunrui/origin_datasets/bnu_en_htr_train/
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - PARSeqAugPIL:
      - GTCLabelEncode:
          gtc_label_encode:
            name: ARLabelEncode
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - RecTVResize:
          image_shape: [32, 512]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length', 'ctc_label', 'ctc_length']
  loader:
    shuffle: True
    batch_size_per_card: 128
    drop_last: True
    num_workers: 4

Eval:
  dataset:
    name: LMDBDataSet
    data_dir: /a800data1/lirunrui/origin_datasets/bnu_en_benchmark_lmdb/common_0
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - GTCLabelEncode:
          gtc_label_encode:
            name: ARLabelEncode
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - RecTVResize:
          image_shape: [32, 512]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length', 'ctc_label', 'ctc_length']
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: 128
    num_workers: 4
