Global:
  device: gpu
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./outputs/output_new_visualC3_ids/resnet45_trans_abinet_wo_lang/
  eval_epoch_step: [0, 1]
  eval_batch_step: [0, 500]
  cal_metric_during_train: True
  pretrained_model:
  checkpoints:
  use_tensorboard: false
  infer_img:
  # for data or label process
  character_dict_path: &character_dict_path ./tools/utils/dict/visual_c3_ids/minimal_ids_dict.txt
  max_text_length: &max_text_length 100
  use_space_char: &use_space_char True
  save_res_path: ./outputs/output_new_visualC3_ids/resnet45_trans_abinet_wo_lang/predicts_resnet45_trans_abinet_wo_lang.txt
  grad_clip_val: 20
  use_amp: True

Optimizer:
  name: AdamW
  lr: 6.5e-4 # for 4gpus bs256/gpu
  weight_decay: 0.05
  filter_bias_and_bn: False

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 5
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: ABINet
  Transform:
  Encoder:
    name: ResNet45
    in_channels: 3
    strides: [2, 1, 2, 1, 1]
  Decoder:
    name: ABINetDecoder
    max_length: *max_text_length
    iter_size: 0

Loss:
  name: ABINetLoss

PostProcess:
  name: ABINetLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  # is_filter: True

Train:
  dataset:
    name: LMDBDataSet
    data_dir: /ipfs/lirunrui/lmdb_dataset/visual_c3_new_ids/train_ids_lmdb
    transforms:
      - DecodeImagePIL: # load image
          img_mode: RGB
      - PARSeqAugPIL:
      - ABINetLabelEncode:
      - RecTVResize:
          image_shape: [32, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length'] # dataloader will return list in this order
  loader:
    shuffle: True
    batch_size_per_card: &batch_size_per_card 256
    drop_last: True
    num_workers: 8

Eval:
  dataset:
    name: LMDBDataSet
    data_dir: /ipfs/lirunrui/lmdb_dataset/visual_c3_new_ids/test_ids_lmdb/test_correct
    transforms:
      - DecodeImagePIL: # load image
          img_mode: RGB
      - ABINetLabelEncode:
      - RecTVResize:
          image_shape: [32, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length'] # dataloader will return list in this order
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: *batch_size_per_card
    num_workers: 8
