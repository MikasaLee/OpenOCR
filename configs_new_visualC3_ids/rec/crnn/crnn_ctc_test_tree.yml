Global:
  device: gpu
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./outputs/output_new_visualC3_ids/crnn_ctc_test_tree/
  save_epoch_step: [1, 25]
  # evaluation is run every 2000 iterations
  eval_batch_step: [0, 2000]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: False
  pretrained_model: 
  checkpoints:
  use_tensorboard: false
  infer_img:
  # for data or label process
  character_dict_path: &character_dict_path ./tools/utils/dict/visual_c3_ids/minimal_ids_dict.txt
  max_text_length: &max_text_length 100
  use_space_char: &use_space_char True
  save_res_path: ./outputs/output_new_visualC3_ids/crnn_ctc_test_tree/predicts_crnn_ctc_test_tree.txt
  use_amp: True

Optimizer:
  name: AdamW
  lr: 6.5e-4 # for 4gpus bs256/gpu
  weight_decay: 0.05
  filter_bias_and_bn: False

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 5
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: CRNN
  Transform:
  Encoder:
    name: ResNet_ASTER
  Decoder:
    name: CTCDecoder

Loss:
  name: CTCLoss
  zero_infinity: True

PostProcess:
  name: CTCLabelDecode
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecMetric
  main_indicator: acc
  # is_filter: True

Train:
  dataset:
    name: LMDBDataSet
    data_dir: /ipfs/lirunrui/lmdb_dataset/visual_c3_new_ids/train_ids_lmdb
    transforms:
      - DecodeImagePIL: # load image
          img_mode: RGB
      - PARSeqAugPIL:
      - IDSTreeLabelEncode:
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
          char_to_ids_path: ./tools/utils/dict/visual_c3_ids/char_to_ids.txt
          add_sos: true
          add_eos: false
          label_mode: ids
      - RecTVResize:
          image_shape: [32, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length', 'tree_parents'] 
  loader:
    shuffle: True
    batch_size_per_card: &batch_size_per_card 256
    drop_last: True
    num_workers: 8

Eval:
  dataset:
    name: LMDBDataSet
    data_dir: /ipfs/lirunrui/lmdb_dataset/visual_c3_new_ids/test_ids_lmdb/test_correct
    transforms:
      - DecodeImagePIL: # load image
          img_mode: RGB
      # - SaveRawImageBytes:  # eval 时打开可保存原始图像
      #   dst_key: image_raw
      #   src_key: image
      - IDSTreeLabelEncode:
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
          char_to_ids_path: ./tools/utils/dict/visual_c3_ids/char_to_ids.txt
          add_sos: true
          add_eos: false
          label_mode: ids
      - RecTVResize:
          image_shape: [32, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
          # keep_keys: ['image', 'label', 'length', 'image_raw'] # eval 时打开可保存原始图像
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: *batch_size_per_card
    num_workers: 8
    # collate_fn: RecWithRawCollator # eval 时打开可保存原始图像
