Global:
  device: gpu
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./outputs/output_bctr/eduocr_2_msr/
  save_epoch_step: [1, 50]
  # evaluation is run every 2000 iterations
  eval_batch_step: [0, 20000000]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: False
  pretrained_model:
  checkpoints:
  use_tensorboard: false
  infer_img:
  # for data or label process
  character_dict_path: &character_dict_path ./tools/utils/ppocr_keys_v1.txt # ch
  max_text_length: &max_text_length 25
  use_space_char: &use_space_char True
  save_res_path: ./outputs/output_bctr/eduocr_2_msr/predicts_eduocr.txt
  use_amp: True
  
Optimizer:
  name: AdamW
  lr: 6.5e-4
  weight_decay: 0.05
  filter_bias_and_bn: True

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 5
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: EduOCR
  in_channels: 3
  Transform:
  Encoder:
    name: SALGEncoder
    use_pos_embed: False
    max_sz: [32, 512]
    dims: [128, 256, 384]
    depths: [6, 6, 6]
    num_heads: [4, 8, 12]
    mixer: [['Conv', 'Conv', 'Conv', 'Conv', 'Conv', 'Conv'],
            ['Conv', 'Conv', 'FGlobal', 'Global', 'Global', 'Global'],
            ['Global', 'Global', 'Global', 'Global', 'Global', 'Global']]
    local_k: [[5, 5], [5, 5], [-1, -1]]
    sub_k: [[2, 1], [2, 1], [-1, -1]]
    downsample: [True, True, False]
    last_stage: false
    use_GBC: True
    feat2d: True
  Decoder:
    name: GTCDecoder
    infer_gtc: True
    detach: False
    gtc_decoder:
      name: SSMDecoder
      num_layers: 3
      nhead: 8
      max_len: *max_text_length
    ctc_decoder:
      name: PPHDecoder
      num_heads: 8

Loss:
  name: GTCLoss
  ctc_weight: 0.05
  gtc_weight: 1.0
  gtc_loss:
    name: ARLoss
    label_smoothing: 0.0

PostProcess:
  name: GTCLabelDecode
  only_gtc: False
  gtc_label_decode:
    name: ARLabelDecode
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecGTCMetric
  main_indicator: gtc_acc
  is_filter: False

Train:
  dataset:
    name: RatioDataSetTVResize
    ds_width: True
    padding: false
    data_dir_list: [
      '/a800data1/lirunrui/origin_datasets/bchw_dataset/bchw_train/document_train',
      '/a800data1/lirunrui/origin_datasets/bchw_dataset/bchw_train/scene_train',
      '/a800data1/lirunrui/origin_datasets/bchw_dataset/bchw_train/hw_train',
      '/a800data1/lirunrui/origin_datasets/bchw_dataset/bchw_train/web_train',
      ]
    transforms:
    - DecodeImagePIL:
        img_mode: RGB
    - PARSeqAugPIL:
    - GTCLabelEncode:
        gtc_label_encode:
          name: ARLabelEncode
        character_dict_path: *character_dict_path
        use_space_char: *use_space_char
        max_text_length: *max_text_length
    - KeepKeys:
        keep_keys: ['image', 'label', 'length', 'ctc_label', 'ctc_length']
  sampler:
    name: RatioSampler
    scales: [[128, 32]] # w, h
    # divide_factor: to ensure the width and height dimensions can be devided by downsampling multiple
    first_bs: &bs 512
    fix_bs: false
    divided_factor: [4, 16] # w, h
    is_training: True
  loader:
    shuffle: True
    batch_size_per_card: *bs
    drop_last: True
    max_ratio: &max_ratio 8
    num_workers: 4

Eval:
  dataset:
    name: RatioDataSetTVResize
    ds_width: True
    padding: False
    data_dir_list: ['/a800data1/lirunrui/origin_datasets/bchw_dataset/scene/scene_test']
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - GTCLabelEncode:
          gtc_label_encode:
            name: ARLabelEncode
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'length', 'ctc_label', 'ctc_length']
  sampler:
    name: RatioSampler
    scales: [[128, 32]] # w, h
    # divide_factor: to ensure the width and height dimensions can be devided by downsampling multiple
    first_bs: *bs
    fix_bs: false
    divided_factor: [4, 16] # w, h
    is_training: False
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: *bs
    max_ratio: *max_ratio
    num_workers: 4